spring.application.name=fragrance-app
server.port=8081

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# =============================================
# Configuración H2 en MODO ARCHIVO ABSOLUTO
# =============================================
spring.datasource.url=jdbc:h2:file:C:\\Users\\Nel\\Desktop\\Universidad\\Ciclo-2026 II\\INTEGRADOR 1\\BD2-PROYECTO-FINAL\\BD2-PROYECTO-FINAL\\database\\fragrancedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;IFEXISTS=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola Web interna de H2 (Accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =============================================
# JPA / Hibernate & SQL Init Config
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Forzar inicialización de scripts y diferir la carga para después del mapeo de Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

