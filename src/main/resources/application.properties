spring.application.name=fragrance-app
server.port=8081

# =============================================
# Configuraci\u00f3n PostgreSQL (DESACTIVADA TEMPORALMENTE)
# =============================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/bd_fragrances
# spring.datasource.username=postgres
# spring.datasource.password=12345
# spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate (DESACTIVADO TEMPORALMENTE PARA POSTGRES)
# =============================================
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.jpa.show-sql=true

# =============================================
# Configuraci\u00f3n temporal con Base de Datos en Memoria (H2)
# =============================================
spring.datasource.url=jdbc:h2:mem:fragrancedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite que Hibernate cree las tablas autom\u00e1ticamente en la memoria RAM
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
